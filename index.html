<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFD537">
<meta name="description" content="망고펜 — 당신의 이야기를 만드는 창작 공간.">
<title>망고펜 MANGOPEN — 상상이 이야기가 되는 곳</title>
<style>
:root{--yellow:#ffd537;--ink:#24221d;--cream:#faf9f5;--stroke:#e9e6dc;--dim:#807e77}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--cream)}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bc8b07;outline-offset:2px}
button{border:0}.top{background:#fff;border-bottom:1px solid var(--stroke);position:sticky;top:0;z-index:5}.top-inner{max-width:1160px;margin:auto;display:flex;align-items:center;gap:26px;padding:12px 22px;min-height:70px}
.brand{font-weight:900;font-size:25px;letter-spacing:-1.8px;white-space:nowrap}.brand:before{content:"✳";background:var(--yellow);display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;margin-right:9px;letter-spacing:0}.brand .dot{color:#d19a00}.nav{display:flex;gap:5px}.nav button{background:transparent;color:#888;padding:11px 14px;font-weight:750;border-radius:9px}.nav button.active{background:#fff3bf;color:#25221b}.top .start{margin-left:auto}
.primary{background:var(--yellow);color:var(--ink);padding:11px 18px;border-radius:11px;font-weight:850}.dark{background:#24221d;color:white;padding:12px 19px;border-radius:11px;font-weight:850}.outline{background:white;border:1px solid var(--stroke);padding:11px 15px;border-radius:10px;font-weight:700}.danger{color:#a6321f}
main{max-width:1160px;margin:0 auto;padding:25px 22px 110px}.notice{background:#fff5d1;border:1px solid #ebcd65;color:#735716;padding:10px 14px;border-radius:12px;font-size:12px;margin-bottom:18px}
.hero{background:var(--yellow);min-height:335px;border-radius:23px;padding:48px 55px;position:relative;overflow:hidden;display:flex;align-items:center}.hero .copy{position:relative;z-index:1}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1px}.hero h1{font-size:clamp(31px,5vw,57px);line-height:1.3;letter-spacing:-2px;margin:18px 0}.hero h1 span{color:white;text-shadow:0 2px 0 #9f8211;-webkit-text-stroke:.7px #29261d}.hero p{color:#73601e;margin-bottom:22px}.graphic{position:absolute;right:12%;top:45px;width:179px;height:244px;padding:21px;background:linear-gradient(145deg,#253b3c,#637469);box-shadow:15px 19px 17px #6e561a33;border-radius:8px;border-left:11px solid #1c2929;transform:rotate(12deg);display:flex;flex-direction:column;justify-content:space-between;color:#ffdf82}.graphic strong{line-height:1.6;font-size:19px}.graphic em{text-align:right;font-size:30px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:18px 0 46px}.quick>div{background:#fff;border:1px solid var(--stroke);padding:17px;border-radius:14px}.quick strong{display:block}.quick small{color:var(--dim)}
.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 18px}.section h2{font-size:28px;letter-spacing:-1px;margin:3px 0}.sub{color:#be9013;font-size:11px;letter-spacing:1.5px;font-weight:850}.muted{color:var(--dim);font-size:13px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.chip{padding:8px 13px;border-radius:100px;background:#fff;border:1px solid var(--stroke);font-size:12px;font-weight:800}.chip.active{background:var(--yellow);border-color:var(--yellow)}.search{margin-left:auto;border:1px solid var(--stroke);border-radius:10px;background:white;min-width:190px;padding:10px 13px}
.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.book{background:transparent;text-align:left;padding:0;color:inherit;min-width:0}.book .cover{height:235px;background:linear-gradient(145deg,#23405a,#7b99b2);border-radius:13px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:white;position:relative;overflow:hidden}.cover .symbol{font-size:68px;opacity:.6;align-self:center;text-shadow:0 0 25px #fff}.cover strong{font-size:17px;line-height:1.3;word-break:keep-all}.cover small{font-size:10px;letter-spacing:1px}.book h3{font-size:16px;margin:9px 0 3px}.book p{color:var(--dim);font-size:12px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book .meta{color:#a57b00;font-size:11px}
.panel{background:white;border:1px solid var(--stroke);border-radius:18px;padding:27px;max-width:820px}.panel h2{margin-top:0}.field{display:block;font-weight:800;font-size:13px;margin:15px 0}.field input,.field textarea,.field select{display:block;width:100%;padding:13px;margin-top:7px;border-radius:10px;border:1px solid #ddd9ce;background:#fffefa;color:var(--ink);font-weight:500}.field textarea{min-height:190px;resize:vertical;line-height:1.8}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>.field{flex:1;min-width:190px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.items{display:grid;gap:11px}.item{background:white;border:1px solid var(--stroke);border-radius:13px;padding:17px;display:flex;gap:16px;align-items:center}.item .grow{flex:1;min-width:0}.item h3{margin:0}.item small{color:var(--dim)}.empty{border:1px dashed #d3cfbf;text-align:center;padding:35px;color:var(--dim);border-radius:14px}
.reader{max-width:790px;margin:auto;background:white;border:1px solid var(--stroke);border-radius:18px;padding:26px 35px}.reader h1{text-align:center;letter-spacing:-1px}.reader .chapter-title{text-align:center;margin:30px 0}.reader .body{font-size:17px;line-height:2.15;white-space:pre-wrap;word-break:break-word;min-height:170px}.reader .foot{border-top:1px solid var(--stroke);margin-top:24px;padding-top:20px;display:flex;justify-content:space-between;gap:10px}
.mode-select{display:flex;gap:9px;flex-wrap:wrap}.mode-select label{border:1px solid var(--stroke);border-radius:11px;padding:13px;background:#faf9f5;flex:1;min-width:155px;cursor:pointer}.mode-select input{accent-color:#d2a500}.mode-select b,.mode-select small{display:block}.mode-select small{color:var(--dim);font-size:11px}
footer{text-align:center;padding:35px;font-size:12px;color:#9a968b;border-top:1px solid var(--stroke)}.mobile-add{display:none}
@media(max-width:900px){.books{grid-template-columns:repeat(3,1fr)}.graphic{right:6%}.hero{padding:42px 32px}}
@media(max-width:650px){.top-inner{min-height:60px;gap:6px;padding:10px 12px}.brand{font-size:19px;letter-spacing:-1px}.brand:before{width:29px;height:29px;border-radius:9px;margin-right:5px}.nav{margin-left:auto;gap:0}.nav button{font-size:12px;padding:8px 9px}.top .start{display:none}main{padding:14px 12px 75px}.hero{padding:34px 27px;min-height:442px;align-items:flex-start}.hero h1{font-size:35px;margin:15px 0}.hero p{font-size:12px}.graphic{top:auto;bottom:25px;right:29px;width:118px;height:139px;padding:12px;border-left-width:7px}.graphic strong{font-size:12px}.quick{grid-template-columns:1fr;margin:13px 0 30px;gap:7px}.quick>div{padding:10px 13px}.quick small{font-size:11px}.section h2{font-size:23px}.books{grid-template-columns:repeat(2,1fr);gap:14px}.book .cover{height:185px}.search{width:100%;margin-left:0}.panel,.reader{padding:19px}.reader .body{font-size:16px}.item{align-items:flex-start;flex-direction:column}.mobile-add{display:block;position:fixed;right:17px;bottom:22px;z-index:3;box-shadow:0 5px 20px #0002}}
.reader .actions{align-items:center}button[disabled]{opacity:.5;cursor:not-allowed} .actions .muted{align-self:center} 
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="brand">mango<span style="font-weight:450">pen</span><span class="dot">.</span></div><nav class="nav"><button data-nav="explore" class="active">발견</button><button data-nav="studio">스튜디오</button><button data-nav="library">내 서재</button></nav><button class="primary start" id="top-create">＋ 새 작품</button></div></header>
<main><div class="notice">✳ 망고펜 체험판 · 작품은 지금 사용하는 브라우저에만 저장돼요. 실제 공개 공유·회원가입·AI 생성·결제는 아직 연결되지 않았습니다.</div><div id="app"></div></main>
<button class="primary mobile-add" id="mobile-create">＋ 새 작품</button>
<footer>✳ MANGOPEN · WEB DEMO · 상표 등록 전 가칭</footer>
<script>
"use strict";
var KEY="mangopen-v01-demo";
var sample=[
{id:"s1",author:"달그림자",title:"별을 삼킨 도서관",genre:"판타지",desc:"별이 사라진 밤, 단 하나의 도서관에서 이야기가 자란다.",symbol:"✦",private:false,mode:"AI 보조",chapters:[{title:"어느 밤의 초대장",body:"그날 밤, 아린은 책갈피 사이에서 별 하나를 발견했다.\n\n별은 작았지만 분명 빛나고 있었다. 낡은 도서관의 창밖으로는 이미 모든 별이 사라진 뒤였다.\n\n“이걸 어디서 찾았니?”\n\n사서 이안의 목소리가 가라앉았다. 아린이 대답하기도 전에 복도 끝의 문이 스스로 열렸다."}]},
{id:"s2",author:"오후세시",title:"회귀한 마법사는 카페를 연다",genre:"현대 판타지",desc:"세상을 구한 대마법사의 마지막 소원은 평범한 카페 사장이 되는 것.",symbol:"☕",private:false,mode:"AI 창작",chapters:[{title:"라테를 만드는 마법사",body:"윤하는 카페에서 작은 우유 거품을 바라봤다.\n\n이번 생에는 마법을 쓰지 않겠다고 다짐했건만, 오늘도 컵 위에는 별 모양이 떠올랐다."}]},
{id:"s3",author:"서랍속우주",title:"비가 내리는 행성",genre:"SF",desc:"백 년 동안 비가 멈추지 않는 행성에서 발견된 마른 편지.",symbol:"☄",private:false,mode:"직접 집필",chapters:[{title:"젖지 않은 편지",body:"이 행성에는 언제나 비가 내렸다.\n\n탐사선이 착륙한 지 열두 시간이 지났을 때, 리오는 기이한 물건을 발견했다. 완전히 마른 편지였다."}]}
];
var own=[];try{var loaded=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(loaded))own=loaded;}catch(e){}
var statKey="mangopen-v02-demo-stats";
var stats={likes:{},views:{}};
try{var ss=JSON.parse(localStorage.getItem(statKey)||"{}");if(ss&&typeof ss==="object"){stats.likes=ss.likes||{};stats.views=ss.views||{}}}catch(e){}
var persistStats=function(){try{localStorage.setItem(statKey,JSON.stringify(stats))}catch(e){}};
var screen="explore",filter="전체",search="",current=null,chapterIndex=0;
var $=function(id){return document.getElementById(id)};
var esc=function(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var all=function(){return sample.concat(own)};
var save=function(){try{localStorage.setItem(KEY,JSON.stringify(own));return true}catch(e){alert("브라우저 저장 공간을 확인해 줘.");return false}};
var find=function(id){return all().find(function(w){return w.id===id})};
var palettes={"판타지":"linear-gradient(145deg,#233d50,#7398aa)","현대 판타지":"linear-gradient(145deg,#4b2e4d,#d09379)","SF":"linear-gradient(145deg,#1a295a,#6c90c7)","로맨스":"linear-gradient(145deg,#933f66,#f7b0a5)","미스터리":"linear-gradient(145deg,#273a3e,#768e85)"};
var header=function(k,t){return '<div class="section"><div><div class="sub">'+k+'</div><h2>'+t+'</h2></div></div>'};
var card=function(w){return '<button class="book" data-read="'+esc(w.id)+'"><div class="cover" style="background:'+(palettes[w.genre]||'linear-gradient(145deg,#5b5135,#a8945c)')+'"><small>✳ MANGOPEN</small><span class="symbol">'+esc(w.symbol||"✎")+'</span><strong>'+esc(w.title)+'</strong></div><h3>'+esc(w.title)+'</h3><p>'+esc(w.desc)+'</p><div class="meta">'+esc(w.author)+' · '+w.chapters.length+'화</div></button>'};
var go=function(name){screen=name;current=null;render();window.scrollTo(0,0)};
var render=function(){
document.querySelectorAll("[data-nav]").forEach(function(b){b.classList.toggle("active",b.dataset.nav===screen)});
var a=$("app"),s="";
if(screen==="explore"){
var visible=all().filter(function(w){return !w.private&&(filter==="전체"||w.genre===filter)&&(w.title+" "+w.author+" "+w.desc).toLowerCase().includes(search.toLowerCase())});
s='<div class="hero"><div class="copy"><div class="eyebrow">✳ 새로운 이야기가 시작되는 곳</div><h1>머릿속 이야기를<br><span>세상 밖으로.</span></h1><p>상상하고, 쓰고, 나누는 창작 공간.<br>누구나 자기만의 세계를 만들 수 있어요.</p><button class="dark" data-create="1">나만의 이야기 시작하기 ↗</button></div><div class="graphic"><small>✳ MANGOPEN</small><strong>모든 세계는<br>한 문장에서<br>시작된다.</strong><em>✳</em></div></div>';
s+='<div class="quick"><div><strong>✦ AI 창작 (준비 중)</strong><small>설정에서 이야기가 시작돼요</small></div><div><strong>✎ 직접 집필</strong><small>내 손으로 쓰는 첫 문장</small></div><div><strong>▤ 작품 공개 (준비 중)</strong><small>지금은 내 브라우저 안에서만</small></div></div>';
s+=header("MANGOPEN LIBRARY","이야기를 발견해 보세요");
s+='<div class="filters">'+["전체","판타지","현대 판타지","로맨스","SF","미스터리"].map(function(g){return '<button class="chip '+(filter===g?"active":"")+'" data-filter="'+esc(g)+'">'+esc(g)+'</button>'}).join("")+'<input class="search" id="search" placeholder="제목, 작가 검색" value="'+esc(search)+'" aria-label="작품 검색"></div>';
s+='<div class="books">'+visible.map(card).join("")+'</div>'+(visible.length?"":'<div class="empty">일치하는 작품이 없어. 새 작품을 만들어 봐!</div>');
}else if(screen==="library"){
s=header("MY LIBRARY","내 서재")+'<div class="actions"><button class="outline" data-export="1">↓ 내 원고 백업</button><button class="outline" data-import="1">↑ 백업 불러오기</button><input type="file" id="backup-file" accept="application/json,.json" style="display:none"></div>'+'<p class="muted">작성한 작품 '+own.length+'편 · 이 기기의 브라우저에만 저장돼요.</p><div class="items">';
s+=own.map(function(w){return '<div class="item"><div class="grow"><h3>'+esc(w.title)+'</h3><small>'+esc(w.genre)+' · '+w.chapters.length+'화 · '+(w.private?"비공개":"공개 표시(이 기기에서만)")+'</small></div><button class="outline" data-edit="'+esc(w.id)+'">집필</button><button class="outline" data-toggle="'+esc(w.id)+'">'+(w.private?"공개 표시":"비공개")+'</button><button class="outline danger" data-delete="'+esc(w.id)+'">삭제</button></div>'}).join("");
s+='</div>'+(own.length?"":'<div class="empty">아직 작품이 없네. 첫 작품을 만들어봐! 🥭</div>')+'<div class="actions"><button class="primary" data-create="1">＋ 새 작품</button></div>';
}else if(screen==="new"){
s=header("MANGOPEN STUDIO","새 작품 만들기")+'<form class="panel" id="work-form"><div class="row"><label class="field">작품 제목<input required maxlength="100" name="title" placeholder="나의 첫 번째 소설"></label><label class="field">필명<input maxlength="40" name="author" placeholder="익명 작가"></label></div><label class="field">장르<select name="genre"><option>판타지</option><option>현대 판타지</option><option>로맨스</option><option>SF</option><option>미스터리</option><option>기타</option></select></label><label class="field">작품 소개<textarea required minlength="5" name="desc" placeholder="독자에게 작품을 소개해 줘." style="min-height:100px"></textarea></label><h3>집필 방식</h3><div class="mode-select"><label><input type="radio" name="mode" value="AI 창작" checked><b>AI 창작</b><small>AI 생성 기능은 연동 준비 중</small></label><label><input type="radio" name="mode" value="AI 보조"><b>AI 보조</b><small>직접 작성 + 향후 AI 도움</small></label><label><input type="radio" name="mode" value="직접 집필"><b>직접 집필</b><small>첫 문장부터 온전히 내 손으로</small></label></div><div class="actions"><button type="submit" class="primary">작품 만들기 →</button><button type="button" class="outline" data-nav="studio">취소</button></div></form>';
}else if(screen==="studio" && current){
var w=find(current);if(!w){current=null;render();return}
s=header("MANGOPEN STUDIO","회차 집필")+'<p class="muted">'+esc(w.title)+' · '+esc(w.mode)+' · 자동 AI 생성은 아직 지원하지 않습니다.</p><form class="panel" id="chapter-form"><label class="field">회차 제목<input name="title" maxlength="100" required placeholder="1화 · 이야기가 시작되다"></label><label class="field">본문<textarea name="body" required rows="16" placeholder="이곳에 이야기를 작성해 보세요."></textarea></label><div class="actions"><button class="primary" type="submit">회차 저장</button><button type="button" class="outline" data-nav="library">← 내 서재</button></div><p class="muted">저장한 글은 현재 브라우저에만 보관됩니다. 중요한 원고는 별도로 백업하세요.</p></form><div class="section"><h2>저장된 회차</h2></div><div class="items">'+w.chapters.map(function(c,i){return '<div class="item"><div class="grow"><strong>'+(i+1)+'화 · '+esc(c.title)+'</strong></div><button class="outline" data-chapter="'+i+'">읽기</button></div>'}).join("")+'</div>';
}else if(screen==="studio"){
s=header("MANGOPEN STUDIO","창작 스튜디오")+'<p class="muted">설정에서 시작해 첫 회차까지 작성해 보세요.</p><div class="panel"><h2>새로운 이야기가 기다리고 있어요.</h2><p>노란 연필 한 자루에서 세계가 시작됩니다.</p><button class="primary" data-create="1">＋ 새 작품 만들기</button></div>';
if(own.length)s+=header("MY WORKS","이어 쓰기")+'<div class="items">'+own.map(function(w){return '<div class="item"><div class="grow"><strong>'+esc(w.title)+'</strong><div class="muted">'+w.chapters.length+'화</div></div><button class="outline" data-edit="'+esc(w.id)+'">이어 쓰기 →</button></div>'}).join("")+'</div>';
}else if(screen==="reader"){
var b=find(current),c=b&&b.chapters[chapterIndex];if(!b){go("explore");return}
s='<div class="actions"><button class="outline" data-nav="explore">← 작품 목록</button><button class="outline" data-like="'+esc(b.id)+'">'+(stats.likes[b.id]?'♥ 좋아요 취소':'♡ 좋아요')+'</button><span class="muted">이 브라우저 내 열람 '+(Number(stats.views[b.id])||0)+'회 · 테스트 지표</span></div><article class="reader"><p class="sub" style="text-align:center">✳ MANGOPEN READER</p><h1>'+esc(b.title)+'</h1><p class="muted" style="text-align:center">'+esc(b.author)+' · '+esc(b.genre)+'</p><hr style="border:0;border-top:1px solid #eee9de"><h2 class="chapter-title">'+(c?(chapterIndex+1)+'화 · '+esc(c.title):'아직 회차가 없습니다')+'</h2><div class="body">'+(c?esc(c.body):'첫 회차를 기다리고 있어요.')+'</div><div class="foot"><button class="outline" data-prev="1" '+(chapterIndex===0?"disabled":"")+'>← 이전 화</button><span class="muted">'+(c?chapterIndex+1:0)+' / '+b.chapters.length+'</span><button class="outline" data-next="1" '+(chapterIndex>=b.chapters.length-1?"disabled":"")+'>다음 화 →</button></div></article>';
}
a.innerHTML=s;
if($("work-form"))$("work-form").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target);var w={id:"w"+Date.now()+"-"+Math.random().toString(36).slice(2,6),title:String(f.get("title")).trim(),author:String(f.get("author")).trim()||"익명 작가",genre:String(f.get("genre")),mode:String(f.get("mode")),desc:String(f.get("desc")).trim(),symbol:"✎",private:true,chapters:[]};if(!w.title||!w.desc)return;own.push(w);save();current=w.id;screen="studio";render();window.scrollTo(0,0)});
if($("chapter-form"))$("chapter-form").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target),w=own.find(function(v){return v.id===current});if(!w)return;var t=String(f.get("title")).trim(),b=String(f.get("body")).trim();if(!t||!b)return;w.chapters.push({title:t,body:b});save();render();alert("회차를 저장했어!");});
if($("search"))$("search").addEventListener("input",function(e){search=e.target.value;var p=e.target.selectionStart;render();var n=$("search");n.focus();n.setSelectionRange(p,p)});
};
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.disabled)return;var d=b.dataset;
if(d.nav){go(d.nav);return}if(d.create){go("new");return}
if(d.filter){filter=d.filter;render();return}
if(d.edit){current=d.edit;screen="studio";render();window.scrollTo(0,0);return}
if(d.like){stats.likes[d.like]=!stats.likes[d.like];persistStats();render();return}
if(d.export){var data={app:"mangopen",version:2,exportedAt:new Date().toISOString(),works:own};var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="mangopen-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);return}
if(d.import){var pick=$("backup-file");if(pick)pick.click();return}
if(d.read){current=d.read;chapterIndex=0;stats.views[current]=(Number(stats.views[current])||0)+1;persistStats();screen="reader";render();window.scrollTo(0,0);return}
if(d.chapter!==undefined){chapterIndex=Number(d.chapter);screen="reader";render();window.scrollTo(0,0);return}
if(d.prev){chapterIndex=Math.max(0,chapterIndex-1);render();window.scrollTo(0,0);return}
if(d.next){chapterIndex++;render();window.scrollTo(0,0);return}
if(d.toggle){var w=own.find(function(w){return w.id===d.toggle});if(w){w.private=!w.private;save();render()}return}
if(d.delete){var w=own.find(function(w){return w.id===d.delete});if(w&&confirm("정말 '"+w.title+"' 작품을 삭제할까? 이 작업은 되돌릴 수 없어.")){own=own.filter(function(v){return v.id!==w.id});save();render()}return}
});
document.addEventListener("change",async function(e){
  if(!e.target||e.target.id!=="backup-file")return;
  var file=e.target.files&&e.target.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert("2MB 이하의 원고 백업 파일만 불러올 수 있어.");return}
  try{
    var raw=JSON.parse(await file.text());
    if(!raw||raw.app!=="mangopen"||!Array.isArray(raw.works)||raw.works.length>200)throw Error("망고펜 백업 형식이 아니거나 작품이 너무 많아.");
    var batch=raw.works.map(function(w,i){
      if(!w||typeof w.title!=="string"||typeof w.desc!=="string"||!Array.isArray(w.chapters)||w.chapters.length>500)throw Error("작품/회차 형식이 올바르지 않아.");
      return {
        id:"w"+Date.now()+"-"+i+"-"+Math.random().toString(36).slice(2,8),
        title:w.title.slice(0,100),
        author:typeof w.author==="string"?w.author.slice(0,40):"익명 작가",
        genre:typeof w.genre==="string"?w.genre.slice(0,40):"기타",
        mode:typeof w.mode==="string"?w.mode.slice(0,40):"직접 집필",
        desc:w.desc.slice(0,2000),
        symbol:"✎",
        private:true,
        chapters:w.chapters.map(function(c){if(!c||typeof c.title!=="string"||typeof c.body!=="string")throw Error("회차 내용이 올바르지 않아.");return {title:c.title.slice(0,100),body:c.body.slice(0,40000)}})
      }
    });
    if(!confirm(batch.length+"개 작품을 이 브라우저의 내 서재에 추가할까? (가져온 작품은 비공개로 설정돼)"))return;
    own=own.concat(batch);save();go("library");alert("백업을 가져왔어! 중요한 글은 원본 파일도 보관해 줘.");
  }catch(err){alert("복원 실패: "+(err&&err.message?err.message:"파일을 확인해 줘"))}
});
$("top-create").onclick=function(){go("new")};$("mobile-create").onclick=function(){go("new")};render();
</script>
</body></html>
